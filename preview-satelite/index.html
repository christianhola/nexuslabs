<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>NEXUS LABS — Sitios con oficio</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#aa967f;color:#0b0a09}.hero{min-height:100svh;display:grid;align-items:center;grid-template-columns:.76fr 1.24fr;gap:32px;width:min(100%,1240px);margin:auto;padding:70px 40px}.copy{position:relative;z-index:1}h1{max-width:14ch;font-size:clamp(2.75rem,6vw,5.75rem);font-weight:500;line-height:.98;letter-spacing:-.055em;margin:0}.cta{display:inline-flex;align-items:center;gap:24px;color:#fff;background:#0b0a09;text-decoration:none;font-weight:650;border-radius:12px;margin-top:36px;padding:6px 6px 6px 20px;min-height:56px;cursor:pointer}.cta:focus-visible{outline:2px solid #0b0a09;outline-offset:4px}.arrow{display:grid;place-items:center;width:44px;height:44px;border-radius:8px;background:#fff;color:#0b0a09;font-size:29px;line-height:1}.figure{position:relative;width:100%;aspect-ratio:728/376}.figure img,.figure video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.figure{mask-image:linear-gradient(to right,transparent,#000 4%,#000 96%,transparent)}@media(max-width:760px){.hero{grid-template-columns:1fr;align-content:center;gap:38px;padding:48px 24px}}@media(prefers-reduced-motion:reduce){video{display:none}}
</style></head>
<body><main class="hero"><div class="copy"><h1>Sitios con oficio.</h1><a class="cta" href="/nexuslabs/plantillas">Ver catálogo<span class="arrow" aria-hidden="true">›</span></a></div><div class="figure" aria-hidden="true"><img src="./satellite-poster.webp" width="728" height="376" alt=""><video muted loop playsinline preload="none" poster="./satellite-poster.webp"></video></div></main>
<script>
const video=document.querySelector('video');
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
function syncPlayback(){
  if(reducedMotion.matches){video.pause();return}
  if(!video.hasAttribute('src')) video.src='./satellite-loop.mp4';
  video.play().catch(()=>{});
}
reducedMotion.addEventListener('change',syncPlayback);
syncPlayback();
</script></body></html>
